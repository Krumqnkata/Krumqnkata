name: Refresh profile visuals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-visuals.yml'
      - 'scripts/generate_profile.py'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Generate public repository statistics
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/generate_profile.py

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/generated/snake-light.svg?color_snake=#238b82&color_dots=#eff5fa,#b7e3da,#78cbbb,#3da796,#147d6f
            assets/generated/snake-dark.svg?palette=github-dark&color_snake=#63e6dc&color_dots=#111e30,#16494b,#247a78,#42b2ab,#63e6dc

      - name: Publish refreshed images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh public profile visuals"
          git pull --rebase origin main
          git push origin HEAD:main
