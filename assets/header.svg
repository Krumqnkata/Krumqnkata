    <radialGradient id="glow"><stop stop-color="#234b73" stop-opacity=".42"/><stop offset="1" stop-color="#234b73" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#809fc6" stroke-opacity=".045"/></pattern>
  </defs>
