<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
  <title id="title">Krum — student developer from Stara Zagora, Bulgaria</title>
  <desc id="desc">A dark navy banner with cyan and gold accents. Krum builds practical software with Python, Java, web technologies and Linux.</desc>
