<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="410" viewBox="0 0 1080 410" role="img" aria-labelledby="title description">
  <title id="title">PGKNMA Blog — application architecture</title>
  <desc id="description">React with TypeScript and Vite exchanges HTTPS JSON requests and responses with Django REST Framework. Django validates requests, applies permissions and accesses MySQL through its ORM. Django Unfold provides administration within the same backend. MySQL stores production data; SQLite is used for local development. This is a simplified application view, deployed on Linux with Apache.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101e35"/>
      <stop offset="1" stop-color="#080f1c"/>
    </linearGradient>
    <marker id="arrow-cyan" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0L6 3L0 6Z" fill="#63e6dc"/>
    </marker>
    <marker id="arrow-gold" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0L6 3L0 6Z" fill="#edc789"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1078" height="408" rx="20" fill="url(#background)" stroke="#2d405a"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="36" y="35" width="25" height="4" rx="2" fill="#63e6dc"/>
    <text x="73" y="42" fill="#9fb2cc" font-size="12" letter-spacing="1.8">PGKNMA BLOG / TECHNICAL OVERVIEW</text>
    <text x="36" y="84" fill="#f3f7ff" font-size="26" font-weight="700">One platform. Three connected layers.</text>

    <rect x="36" y="112" width="292" height="220" rx="14" fill="#111e30" stroke="#36516e"/>
    <path d="M54 113H310" stroke="#63e6dc" stroke-width="2"/>
    <text x="56" y="140" fill="#63e6dc" font-size="11" letter-spacing="1.5">01 / BROWSER</text>
    <text x="56" y="183" fill="#f3f7ff" font-size="32" font-weight="700">React</text>
    <text x="56" y="212" fill="#b8cbe2" font-size="16">TypeScript · Vite</text>
    <path d="M56 229H308" stroke="#2a405b"/>
    <text x="56" y="255" fill="#e0e9f6" font-size="14">Pages and interactive UI</text>
    <text x="56" y="279" fill="#e0e9f6" font-size="14">TanStack Query: fetch and cache</text>
    <text x="56" y="311" fill="#91a9c6" font-size="13">News · events · polls · profiles</text>

    <g fill="none" stroke="#63e6dc" stroke-width="1.8" marker-end="url(#arrow-cyan)">
      <path d="M337 194H374"/>
      <path d="M374 218H337"/>
    </g>
    <text x="356" y="166" text-anchor="middle" fill="#9fd9d6" font-size="10" letter-spacing=".4">HTTPS</text>
    <text x="356" y="244" text-anchor="middle" fill="#9fd9d6" font-size="10" letter-spacing=".4">JSON</text>

    <rect x="384" y="112" width="312" height="220" rx="14" fill="#111e30" stroke="#36516e"/>
    <path d="M402 113H678" stroke="#8ab9ff" stroke-width="2"/>
    <text x="404" y="140" fill="#8ab9ff" font-size="11" letter-spacing="1.5">02 / BACKEND</text>
    <text x="404" y="183" fill="#f3f7ff" font-size="32" font-weight="700">Django</text>
    <text x="404" y="212" fill="#b8cbe2" font-size="16">REST Framework</text>
    <path d="M404 229H676" stroke="#2a405b"/>
    <text x="404" y="255" fill="#e0e9f6" font-size="14">Validation and permissions</text>
    <text x="404" y="279" fill="#e0e9f6" font-size="14">Database access through Django ORM</text>
    <rect x="404" y="296" width="272" height="25" rx="6" fill="#1b2b44"/>
    <text x="418" y="313" fill="#aecaef" font-size="12">Admin panel · Django Unfold</text>

    <g fill="none" stroke="#edc789" stroke-width="1.8" marker-end="url(#arrow-gold)">
      <path d="M705 194H742"/>
      <path d="M742 218H705"/>
    </g>
    <text x="724" y="166" text-anchor="middle" fill="#e0c595" font-size="10" letter-spacing=".4">SQL</text>
    <text x="724" y="244" text-anchor="middle" fill="#e0c595" font-size="10" letter-spacing=".4">DATA</text>

    <rect x="752" y="112" width="292" height="220" rx="14" fill="#111e30" stroke="#36516e"/>
    <path d="M770 113H1026" stroke="#edc789" stroke-width="2"/>
    <text x="772" y="140" fill="#edc789" font-size="11" letter-spacing="1.5">03 / DATABASE</text>
    <text x="772" y="183" fill="#f3f7ff" font-size="32" font-weight="700">MySQL</text>
    <text x="772" y="212" fill="#b8cbe2" font-size="16">Production data</text>
    <path d="M772 229H1024" stroke="#2a405b"/>
    <text x="772" y="255" fill="#e0e9f6" font-size="14">Posts · events · user profiles</text>
    <text x="772" y="279" fill="#e0e9f6" font-size="14">Polls · notification records</text>
    <text x="772" y="311" fill="#91a9c6" font-size="13">SQLite for local development</text>

    <path d="M36 355H1044" stroke="#2a405b"/>
    <text x="36" y="385" fill="#91a9c6" font-size="13">Simplified application view</text>
    <text x="1044" y="385" text-anchor="end" fill="#b8cbe2" font-size="13">Deployment · Linux / Apache</text>
  </g>
</svg>
